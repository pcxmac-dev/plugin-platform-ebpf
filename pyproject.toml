[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plugin-platform-ebpf"
version = "0.1.0"  # the plugin's own release (CHANGELOG.md); the app shows it on the Plugins view
description = "The eBPF API plugin for Liminal: this machine's eBPF runtime, the Linux-vs-Windows capability matrix, basic functions, and the watch service the firewalls' Filter tabs and trapdoor ask."
readme = "README.md"
requires-python = ">=3.10"
# the library it plugs into (the machine kind: liminal_libs.machines, plugin API 2.2) and its eBPF layer
# (liminal_libs.ebpf and machines/etw.py, since 1.54.0); 1.57.0 is the floor: from there the Linux runtime applies on
# any Linux, a WSL distribution included (the user's rule of 2026-11-15), and machines.linux has the WSL helpers (wsl,
# wsl_generation, systemd_runs), which the plugin still reaches through getattr
dependencies = ["liminal-libs>=1.57.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.entry-points."liminal.providers"]
ebpf = "plugin_platform_ebpf"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
